<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PUME AI 면접 프로토타입 — LangGraph 기반 자연스러운 AI 면접관">
    <title>PUME Interview — AI 면접 프로토타입</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- ── Setup Screen ── -->
        <div id="setup-screen" class="screen active">
            <div class="setup-container">
                <div class="setup-logo">
                    <div class="logo-icon">
                        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                            <rect width="48" height="48" rx="12" fill="url(#logo-gradient)"/>
                            <path d="M14 20C14 17.7909 15.7909 16 18 16H30C32.2091 16 34 17.7909 34 20V28C34 30.2091 32.2091 32 30 32H18C15.7909 32 14 30.2091 14 28V20Z" stroke="white" stroke-width="2"/>
                            <circle cx="21" cy="23" r="2" fill="white"/>
                            <circle cx="27" cy="23" r="2" fill="white"/>
                            <path d="M20 28C20 28 22 30 24 30C26 30 28 28 28 28" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                            <defs>
                                <linearGradient id="logo-gradient" x1="0" y1="0" x2="48" y2="48">
                                    <stop stop-color="#6366F1"/>
                                    <stop offset="1" stop-color="#8B5CF6"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <h1>PUME Interview</h1>
                    <p class="subtitle">LangGraph 기반 AI 면접 프로토타입</p>
                </div>

                <div class="setup-form">
                    <div class="form-group">
                        <label for="company-select">면접 회사</label>
                        <select id="company-select">
                            <option value="ai_platform">AI 플랫폼 기업</option>
                            <option value="fintech">핀테크 스타트업</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="role-select">지원 직무</label>
                        <select id="role-select">
                            <option value="mlops_engineer">MLOps 엔지니어</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>파이프라인 모드</label>
                        <div class="mode-selector" id="mode-selector">
                            <button class="mode-btn active" data-mode="single" type="button">
                                <span class="mode-title">⚡ Single-Agent</span>
                                <span class="mode-desc">LLM 1회 호출 · 빠른 응답</span>
                            </button>
                            <button class="mode-btn" data-mode="multi" type="button">
                                <span class="mode-title">🔬 Multi-Agent</span>
                                <span class="mode-desc">LLM 3회 호출 · 정밀 분석</span>
                            </button>
                        </div>
                    </div>
                    <div class="form-group" id="strategy-group">
                        <label>스트리밍 전략 <span class="label-hint">(Single-Agent 전용)</span></label>
                        <div class="strategy-selector" id="strategy-selector">
                            <button class="strategy-btn active" data-strategy="response_first" type="button">
                                <span class="strategy-icon">⚡</span>
                                <span class="strategy-info">
                                    <span class="strategy-title">Response-First</span>
                                    <span class="strategy-desc">답변 먼저, 분석 나중에 · TTFT ~0.1s</span>
                                </span>
                            </button>
                            <button class="strategy-btn" data-strategy="response_only" type="button">
                                <span class="strategy-icon">💬</span>
                                <span class="strategy-info">
                                    <span class="strategy-title">Response-Only</span>
                                    <span class="strategy-desc">순수 대화 · 분석 없음 · 가장 빠름</span>
                                </span>
                            </button>
                            <button class="strategy-btn" data-strategy="think_response" type="button">
                                <span class="strategy-icon">🧠</span>
                                <span class="strategy-info">
                                    <span class="strategy-title">Think+Response</span>
                                    <span class="strategy-desc">내부 추론 후 응답 · 고품질 · 느림</span>
                                </span>
                            </button>
                        </div>
                    </div>
                    <button id="start-btn" class="btn-primary">
                        <span>면접 시작하기</span>
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M4 10H16M16 10L11 5M16 10L11 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>

                <div class="setup-info">
                    <div class="info-chip">
                        <span class="chip-icon">🤖</span>
                        <span>Qwen3 8B (Local SLM)</span>
                    </div>
                    <div class="info-chip">
                        <span class="chip-icon">🔗</span>
                        <span>LangGraph Pipeline</span>
                    </div>
                    <div class="info-chip">
                        <span class="chip-icon">🇰🇷</span>
                        <span>한국어 면접</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ── Interview Screen ── -->
        <div id="interview-screen" class="screen">
            <header id="interview-header">
                <div class="header-left">
                    <div class="header-logo-mini">
                        <svg width="28" height="28" viewBox="0 0 48 48" fill="none">
                            <rect width="48" height="48" rx="12" fill="url(#logo-gradient-mini)"/>
                            <circle cx="21" cy="23" r="2" fill="white"/>
                            <circle cx="27" cy="23" r="2" fill="white"/>
                            <defs>
                                <linearGradient id="logo-gradient-mini" x1="0" y1="0" x2="48" y2="48">
                                    <stop stop-color="#6366F1"/>
                                    <stop offset="1" stop-color="#8B5CF6"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <div class="header-info">
                        <h2 id="header-company">AI 플랫폼 기업</h2>
                        <div class="header-badges">
                            <span id="header-role" class="header-role-badge">MLOps 엔지니어</span>
                            <span id="header-mode" class="header-mode-badge mode-single">⚡ Single</span>
                            <span id="header-elapsed" class="header-elapsed-badge">—</span>
                        </div>
                    </div>
                </div>
                <div class="header-right">
                    <button id="toggle-debug" class="btn-icon" title="디버그 패널 토글">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M17.45 10c-.22-.66-.54-1.28-.95-1.83l1.13-1.13-1.41-1.41-1.13 1.13A7.96 7.96 0 0013.26 5.8l.01-1.6H11.5l-.01 1.3A8.06 8.06 0 0010 5.25c-.52 0-1.02.09-1.49.24L8.5 4.2H6.73l.01 1.6c-.67.33-1.28.76-1.83 1.25L3.78 5.92 2.37 7.33l1.13 1.13c-.41.55-.73 1.17-.95 1.83" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <button id="end-interview" class="btn-icon btn-danger" title="면접 종료">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M6 6L14 14M6 14L14 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>
            </header>

            <div id="main-content">
                <!-- ── Chat Area ── -->
                <div id="chat-container">
                    <div id="chat-messages">
                        <!-- Messages will be inserted here -->
                    </div>
                    <div id="typing-indicator" class="hidden">
                        <div class="typing-avatar">
                            <svg width="20" height="20" viewBox="0 0 48 48" fill="none">
                                <rect width="48" height="48" rx="12" fill="url(#typing-grad)"/>
                                <circle cx="21" cy="23" r="2" fill="white"/>
                                <circle cx="27" cy="23" r="2" fill="white"/>
                                <defs><linearGradient id="typing-grad" x1="0" y1="0" x2="48" y2="48"><stop stop-color="#6366F1"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient></defs>
                            </svg>
                        </div>
                        <div class="typing-dots">
                            <span></span><span></span><span></span>
                        </div>
                    </div>
                </div>

                <!-- ── Input Area ── -->
                <div id="input-area">
                    <div class="input-container">
                        <textarea
                            id="message-input"
                            placeholder="답변을 입력하세요..."
                            rows="1"
                            maxlength="2000"
                        ></textarea>
                        <button id="send-btn" class="btn-send" disabled>
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M3 10L17 3L10 17L9 11L3 10Z" fill="currentColor"/>
                            </svg>
                        </button>
                    </div>
                    <div class="input-footer">
                        <span id="char-count">0 / 2000</span>
                        <span id="status-indicator" class="status-dot status-connected">연결됨</span>
                    </div>
                </div>

                <!-- ── Debug Panel ── -->
                <aside id="debug-panel" class="hidden">
                    <div class="debug-header">
                        <h3>🔍 파이프라인 디버그</h3>
                    </div>
                    <div class="debug-content">
                        <div class="debug-section">
                            <h4>Phase 제어</h4>
                            <div class="debug-row">
                                <span class="debug-label">현재 Phase</span>
                                <span id="debug-phase" class="debug-value phase-badge">—</span>
                            </div>
                            <div class="debug-row">
                                <span class="debug-label">제안 Phase</span>
                                <span id="debug-proposed" class="debug-value">—</span>
                            </div>
                            <div class="debug-row">
                                <span class="debug-label">전환 이유</span>
                                <span id="debug-reason" class="debug-value debug-reason-text">—</span>
                            </div>
                        </div>
                        <div class="debug-section">
                            <h4>상태</h4>
                            <div class="debug-row">
                                <span class="debug-label">턴</span>
                                <span id="debug-turn" class="debug-value">0</span>
                            </div>
                            <div class="debug-row">
                                <span class="debug-label">난이도</span>
                                <span id="debug-difficulty" class="debug-value">
                                    <span id="debug-difficulty-bar" class="difficulty-bar"></span>
                                </span>
                            </div>
                            <div class="debug-row">
                                <span class="debug-label">Retrieval</span>
                                <span id="debug-retrieval" class="debug-value">—</span>
                            </div>
                        </div>
                        <div class="debug-section">
                            <h4>지원자 분석</h4>
                            <div id="debug-analysis" class="debug-analysis-content">—</div>
                        </div>
                        <div class="debug-section">
                            <h4>미검증 역량</h4>
                            <div id="debug-unverified" class="debug-tags">—</div>
                        </div>
                        <div class="debug-section">
                            <h4>강점</h4>
                            <div id="debug-strengths" class="debug-list">—</div>
                        </div>
                        <div class="debug-section">
                            <h4>리스크</h4>
                            <div id="debug-risks" class="debug-list">—</div>
                        </div>
                        <div class="debug-section">
                            <h4>Phase 이력</h4>
                            <div id="debug-phase-history" class="debug-phase-flow">—</div>
                        </div>
                    </div>
                </aside>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
